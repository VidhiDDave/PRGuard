[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prguard"
version = "0.1.0"
description = "Pre-merge code review CLI for Swift, Python, and Java."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8"
]

[project.scripts]
prguard = "prguard.cli:main"

[tool.setuptools.packages.find]
include = ["prguard*"]